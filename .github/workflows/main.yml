name: TR PORT APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ ! -d "$SDK" ]; then
            SDK=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

          TOOL=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$TOOL" ]; then
            echo "sdkmanager bulunamadı"
            find /usr/local -name sdkmanager 2>/dev/null
            exit 1
          fi

          echo "$(dirname "$TOOL")" >> $GITHUB_PATH
          echo "SDK tool: $TOOL"

          "$TOOL" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper bulunamadı"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TR-PORT-APK
          path: "**/build/outputs/apk/debug/*.apk"
